global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka:7071"]

  - job_name: connect-jmx
    static_configs:
      - targets: ["connect:7072"]

  - job_name: portal
    metrics_path: /metrics
    static_configs:
      - targets: ["portal:8085"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
