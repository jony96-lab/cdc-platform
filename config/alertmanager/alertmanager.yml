route:
  receiver: portal
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  # Webhook al Portal de Pipelines: las alertas se ven en http://localhost:8085/alerts
  - name: portal
    webhook_configs:
      - url: http://portal:8085/alerts/webhook
        send_resolved: true

  # Módulo de e-mail: descomentar y completar para recibir alertas por correo
  # - name: email
  #   email_configs:
  #     - to: oncall@example.com
  #       from: alertmanager@example.com
  #       smarthost: smtp.example.com:587
  #       auth_username: alertmanager@example.com
  #       auth_password: CHANGEME
  #       require_tls: true

inhibit_rules:
  # Si la infra base está caída, silenciar alertas derivadas del pipeline
  - source_matchers: [ 'alertname = "ConnectWorkerDown"' ]
    target_matchers: [ 'severity = "warning"' ]
    equal: []
