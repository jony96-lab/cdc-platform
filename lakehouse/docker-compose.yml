# ==============================================================
# PROYECTO INDEPENDIENTE: cdc-lakehouse
#   CDC -> Parquet/Iceberg en MinIO + SQL con Trino
#
# Es un proyecto Compose SEPARADO del cdc-platform (no comparten
# ciclo de vida). Requisitos:
#   - cdc-platform creado al menos una vez (red cdc-net) para el
#     monitoreo cruzado del Portal. Si no queres esa integracion,
#     borra la seccion de cdc-net (external) de este archivo.
#   - LH_* y PG_* definidos en .env (render por gen-secrets.ps1)
#
# Uso (desde la raiz del repo):
#   scripts/lakehouse-up.ps1
#   scripts/lakehouse-sql.ps1 "SELECT ..."
#   docker compose -f lakehouse/docker-compose.yml down   (solo lakehouse)
# ==============================================================

name: cdc-lakehouse

networks:
  lh-net:
    name: lh-net
    driver: bridge
  cdc-net:
    external: true
    name: cdc-net

volumes:
  minio-data:
    name: cdc-minio-data        # mismos volumenes que uso previo -> datos preservados
  trino-data:
    name: cdc-trino-data
  lakehouse-offsets:
    name: cdc-lakehouse-offsets

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: cdc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LH_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${LH_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [lh-net, cdc-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Bucket inicial (one-shot)
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: cdc-minio-init
    profiles: ["lakehouse-init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c",
      "mc alias set lh http://minio:9000 ${LH_MINIO_ROOT_USER} ${LH_MINIO_ROOT_PASSWORD} && mc mb -p lh/lakehouse && echo 'bucket lakehouse OK'"]
    networks: [lh-net]
    restart: "no"

  # CDC -> Iceberg (parquet) en MinIO
  debezium-lakehouse:
    image: ghcr.io/memiiso/debezium-server-iceberg:latest
    container_name: cdc-debezium-lakehouse
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./build/lakehouse/debezium/application.properties:/debezium/config/application.properties:ro
      - lakehouse-offsets:/debezium/data
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    <<: *host-gateway
    networks: [lh-net, cdc-net]
    restart: unless-stopped

  # Motor SQL sobre el lakehouse
  trino:
    image: trinodb/trino:483
    container_name: cdc-trino
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./build/lakehouse/trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    ports:
      - "8086:8080"
    <<: *host-gateway
    networks: [lh-net, cdc-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
