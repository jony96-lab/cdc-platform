# ==============================================================
# Overlay de monitoreo: Prometheus + Grafana + Alertmanager + exporters
# Uso: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# (scripts/up.ps1 ya lo incluye automaticamente)
# ==============================================================

services:

  prometheus:
    image: ${PROM_IMAGE}
    container_name: cdc-prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [cdc-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: cdc-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [cdc-net]
    restart: unless-stopped

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    container_name: cdc-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Montaje por DIRECTORIO: el script regenera el yml (borra+recrea el archivo)
      # y el contenedor siempre ve la version nueva en restart
      - ./build/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks: [cdc-net]
    restart: unless-stopped

  mysqld-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE}
    container_name: cdc-mysqld-exporter
    command:
      - --config.my-cnf=/.my.cnf
      - --mysqld.address=${MYSQL_HOST}:${MYSQL_PORT}
      - --collect.binlog_size
      - --collect.info_schema.innodb_metrics
    volumes:
      - ./secrets/mysqld-exporter.my.cnf:/.my.cnf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cdc-net]
    restart: unless-stopped

  postgres-exporter:
    image: ${PG_EXPORTER_IMAGE}
    container_name: cdc-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_CDC_ROLE}:${PG_CDC_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_TARGET_DB}?sslmode=disable"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cdc-net]
    restart: unless-stopped

volumes:
  prometheus-data:
    name: cdc-prometheus-data
  alertmanager-data:
    name: cdc-alertmanager-data
